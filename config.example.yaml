owner:
  openId: ou_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# Every group the bot is added to is an Allowed Group; no group list is configured.

repositories:
  - owner/private-repo

bot:
  chatModel: qwen3:14b
  embeddingModel: bge-m3
  # Ollama num_ctx for chat requests
  contextTokens: 16384

rateLimit:
  maxRequests: 10
  windowSeconds: 60

memory:
  proposalTtlDays: 7
  extractionIdleMinutes: 30

storage:
  database: ./data/per_bot.db
